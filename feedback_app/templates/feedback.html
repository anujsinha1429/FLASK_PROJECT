{% extends "base.html" %}

{% block title %} Feedback Page {% endblock %}

{% block content %}
    <h2>Submit Your Feedback</h2>
    <form method="post" action="/">
         {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul style="color: brown;">
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" placeholder="enter your name"><br>
        
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="enter your gmail"><br><br>
        
        <label for="msg">Feedback:</label><br>
        <textarea id="msg" name="message" rows="4" cols="50" required placeholder="write your Feedback"></textarea><br><br>
        
        <input type="submit" value="Submit">
    </form>
{% endblock %}
